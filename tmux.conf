set -g default-terminal "tmux-256color"

setw -g xterm-keys on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set -g prefix2 C-a                        # GNU-Screen compatible prefix
bind C-a send-prefix -2


set -g history-limit 5000                 # boost history

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

########################### PANE ###################################

# New windows on the same current directory
bind c new-window -c "#{pane_current_path}"

# Pane movement: Shift + H/J/K/L (vim layout, no prefix). tmux reports a
# shifted letter as the capital letter, so the keys are bound as H/J/K/L.
# Cost: those four capital letters never reach the pane, so they cannot be
# typed anywhere inside tmux while these bindings are active.
bind -n H select-pane -L
bind -n J select-pane -D
bind -n K select-pane -U
bind -n L select-pane -R

# Retire the shift+arrow and ctrl+arrow pane binds (config reload is additive,
# so an already-running server would otherwise keep them alongside the new
# bindings). Shift+Up/Down going free lets the agent CLI use its own shortcuts.
unbind -n S-Left
unbind -n S-Right
unbind -n S-Up
unbind -n S-Down
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down

bind-key C-o rotate-window

########################### COPY ###################################

# vi is good
set-window-option -g mode-keys vi

# mouse behavior
set -g mouse on 

# copy mode like vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# activity
set -g monitor-activity on
set -g visual-activity off

# Truecolor passthrough: Ghostty reports as xterm-256color without COLORTERM
set -u terminal-features                    # restore built-in defaults (keeps reload idempotent)
set -as terminal-features ',xterm-256color:RGB'
set-environment -g COLORTERM truecolor
set-environment -gu NO_COLOR                # keep CLI color enabled inside tmux

# 두꺼운 패널 구분선 (테마와 무관하게 유지)
set -g pane-border-lines heavy

# -- 하단바 테마: catppuccin (Mocha) --------------------------------------------
# 받아둔 곳: ~/.config/tmux/plugins/catppuccin/tmux
# 새 기계에서 받는 방법:
#   mkdir -p ~/.config/tmux/plugins/catppuccin
#   git clone -b v2.3.0 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux
set -g @catppuccin_flavor "mocha"              # latte / frappe / macchiato / mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "text"         # 아이콘 글꼴이 없어도 창 상태 표시가 깨지지 않는다
set -g status-interval 1                       # 시계의 초가 실제로 돌아간다
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M:%S"

# 테마를 먼저 불러와야 아래 조각 변수가 생긴다.
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# 왼쪽: 세션 이름(접두키를 누르면 색이 빨강으로 바뀌어 접두키 상태를 알려준다)
# 오른쪽: 시각, 컴퓨터 이름
set -g status-left-length 30
set -gF status-left "#{E:@catppuccin_status_session}"
set -g status-right-length 120
set -gF status-right "#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_host}"

# 아이콘이 네모나 물음표로 보이면(글꼴 문제) 아래 세 줄의 주석을 풀면 된다.
